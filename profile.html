<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>

    <style>
        body {
            background-color: antiquewhite;
            margin: 0;
            min-height: 100vh;
            font: small monospace, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;
            margin-top: 0.66rem;
            gap: 1rem;
        }

        section {
            width: 100%;
            max-width: 440px;
            padding: 0 1rem;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            border: 1px solid #b9ae9c;
            border-radius: 10px;

            padding: 11px 13px;
            font: inherit;
            font-size: 15px;
            margin-bottom: 16px;
            background-color: #fffaf2;
        }

        input::placeholder {
            color: #a8a9aa;
        }

        input:focus {
            outline: 2px solid #3bdf25;
            outline-offset: 1px;
        }

        input[readonly] {
            background-color: #efe6d8;
            color: #5b5348;
        }

        input[type="file"] {
            background-color: transparent;
            border-style: dashed;
            padding: 9px 11px;
            font-size: 13px;
        }

        button {
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid #000;
            background-color: #5f6675;
            color: snow;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background-color: #4c525f;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        header {
            padding: 1rem;
            background-color: #5f6675;
            color: snow;
        }

        h4 {
            margin: 0 0 1rem;
        }

        .hint {
            font-size: 12px;
            color: #6b6257;
            margin: -10px 0 16px;
        }

        .status {
            font-size: 13px;
            min-height: 1.2em;
            margin: 0.5rem 0 0;
        }

        .status.error {
            color: crimson;
        }

        .status.success {
            color: #1d6b2f;
        }

        .preview {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 16px;
        }

        .preview img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #b9ae9c;
            border-radius: 10px;
            background-color: #fffaf2;
        }

        .preview p {
            margin: 0;
            font-size: 12px;
            color: #6b6257;
            flex: 1;
        }
    </style>
</head>

<body>
    <header>
        <h3>My Great App Profile Page:</h3>
    </header>

    <div class="wrapper">

        <section>
            <h4>Your profile</h4>

            <form id="profile-form" novalidate>
                <label for="email">Email</label>
                <input id="email" type="email" readonly placeholder="loading…">
                <p class="hint">From your signed-in session — not editable here.</p>

                <label for="username">Username</label>
                <input id="username" type="text" autocomplete="username" placeholder="e.g. dave" required>

                <label for="image">Profile image</label>
                <input id="image" type="file" accept="image/jpeg,image/png,image/gif">
                <p class="hint">JPG, PNG or GIF — max 400&times;400 pixels and 500 KB.</p>

                <div class="preview" id="preview-wrap" hidden>
                    <img id="preview" alt="Profile image preview">
                    <p id="preview-meta"></p>
                </div>

                <div>
                    <button id="submit" type="submit" disabled>Save profile</button>
                </div>

                <p class="status" id="status" role="status" aria-live="polite">Checking your session…</p>
            </form>

            <p class="hint" style="margin-top: 1.5rem;">
                Need to sign in? <a href="signup.html">Go to the sign-up page</a>.
            </p>
        </section>

    </div>

    <script>
        const SUPABASE_URL = 'https://decwucuwqnzrxzbxxifu.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ONnalS_8pdIUH2Qrsz67CA_z4Wco9I2';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const TABLE = 'user_profiles';
        const BUCKET = 'avatars';
        const MAX_PX = 400;              // biggest width or height allowed
        const MAX_BYTES = 500 * 1024;    // matches the bucket's 500 KB cap
        const ALLOWED = ['image/jpeg', 'image/png', 'image/gif'];

        const form = document.getElementById('profile-form');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const imageInput = document.getElementById('image');
        const submitButton = document.getElementById('submit');
        const statusEl = document.getElementById('status');
        const previewWrap = document.getElementById('preview-wrap');
        const previewImg = document.getElementById('preview');
        const previewMeta = document.getElementById('preview-meta');

        let currentUser = null;      // session.user
        let existingProfile = null;  // the row, if this user already has one
        let pendingFile = null;      // the file chosen in this visit
        let previewObjectUrl = null; // so we can free it

        // ---------------------------------------------------------------- ui --
        function setStatus(message, kind) {
            statusEl.textContent = message || '';
            statusEl.className = 'status' + (kind ? ' ' + kind : '');
        }

        function setBusy(busy) {
            submitButton.disabled = busy || !currentUser;
            submitButton.textContent = busy
                ? 'Saving…'
                : (existingProfile ? 'Update profile' : 'Save profile');
        }

        function releasePreviewUrl() {
            if (previewObjectUrl) {
                URL.revokeObjectURL(previewObjectUrl);
                previewObjectUrl = null;
            }
        }

        function showObjectPreview(url, meta) {
            releasePreviewUrl();
            previewObjectUrl = url;
            previewImg.src = url;
            previewMeta.textContent = meta;
            previewWrap.hidden = false;
        }

        function showStoredPreview(path, meta) {
            releasePreviewUrl();
            const { data } = db.storage.from(BUCKET).getPublicUrl(path);
            previewImg.src = data.publicUrl;
            previewMeta.textContent = meta;
            previewWrap.hidden = false;
        }

        // Turns Supabase's error codes into something a human can read.
        // thanks to deepseek 
        function friendly(error) {
            const code = error?.code;
            const message = error?.message || String(error);

            if (code === '23505') {
                return 'That username (or email) is already taken. Try a different username.';
            }
            if (code === '42501') {
                return 'The database refused the write. Sign in again — or check the RLS policies on ' + TABLE + '.';
            }
            // Storage reports the same wording as a table RLS failure, so it is
            // checked after the table's SQLSTATE above.
            if (/row-level security/i.test(message)) {
                return 'Storage refused the upload: the "' + BUCKET + '" bucket has no policy allowing writes. Add the storage policy from create-avatars-bucket.sql, then try again.';
            }
            if (/bucket not found/i.test(message)) {
                return 'The "' + BUCKET + '" bucket does not exist yet. Run create-avatars-bucket.sql in the Supabase SQL editor.';
            }
            if (/exceeded the maximum allowed size|payload too large/i.test(message)) {
                return 'That file is bigger than the bucket allows (500 KB). Choose a smaller image.';
            }
            if (/failed to fetch|networkerror/i.test(message)) {
                return 'Network problem — check your connection and the project URL.';
            }
            return message;
        }

        function extensionFor(file) {
            const byType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif' };
            return byType[file.type] || (file.name.split('.').pop() || 'jpg').toLowerCase();
        }

        // Resolves once the browser knows the image's real dimensions.
        function readImage(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => resolve({ img, url });
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('That file could not be read as an image.'));
                };
                img.src = url;
            });
        }

        // ------------------------------------------------------------- the 400 --
        // Checked here because the database cannot measure an image. The file is
        // uploaded unchanged, so animated GIFs keep their animation.
        async function handleFileChoice() {
            pendingFile = null;
            const file = imageInput.files[0];

            if (!file) {
                if (existingProfile) {
                    showStoredPreview(existingProfile.imagename, 'Current image — choose a file to replace it.');
                } else {
                    previewWrap.hidden = true;
                }
                return;
            }

            if (!ALLOWED.includes(file.type)) {
                setStatus('Please choose a JPG, PNG or GIF file.', 'error');
                imageInput.value = '';
                return;
            }

            if (file.size > MAX_BYTES) {
                setStatus('That file is ' + Math.round(file.size / 1024) + ' KB. The limit is 500 KB.', 'error');
                imageInput.value = '';
                return;
            }

            try {
                const { img, url } = await readImage(file);
                const w = img.naturalWidth;
                const h = img.naturalHeight;

                if (w > MAX_PX || h > MAX_PX) {
                    URL.revokeObjectURL(url);
                    imageInput.value = '';
                    setStatus('That image is ' + w + '×' + h + '. The maximum is ' + MAX_PX + '×' + MAX_PX + '.', 'error');
                    return;
                }

                pendingFile = file;
                showObjectPreview(url, file.name + ' — ' + w + '×' + h + ' px');
                setStatus('');
            } catch (error) {
                imageInput.value = '';
                setStatus(friendly(error), 'error');
            }
        }

        // ------------------------------------------------------------ the row --
        async function loadProfile() {
            const { data: sessionData, error: sessionError } = await db.auth.getSession();

            if (sessionError) {
                setStatus(friendly(sessionError), 'error');
                return;
            }

            const session = sessionData.session;
            if (!session) {
                setStatus('You are not signed in. Sign in first, then come back to this page.', 'error');
                submitButton.disabled = true;
                return;
            }

            currentUser = session.user;
            emailInput.value = currentUser.email;

            const { data: rows, error } = await db
                .from(TABLE)
                .select('*')
                .eq('uuid', currentUser.id)
                .limit(1);

            if (error) {
                setStatus('Could not load your profile: ' + friendly(error), 'error');
                submitButton.disabled = false;
                return;
            }

            if (rows && rows.length > 0) {
                existingProfile = rows[0];
                usernameInput.value = existingProfile.username || '';
                showStoredPreview(existingProfile.imagename, 'Current image — choose a file to replace it.');
                setStatus('You already have a profile. Edit the fields and save.', '');
            } else {
                setStatus('No profile yet — pick a username and an image.', '');
            }

            setBusy(false);
        }

        async function saveProfile(event) {
            event.preventDefault();
            if (!currentUser) return;

            const username = usernameInput.value.trim();

            if (!username) {
                setStatus('Please choose a username.', 'error');
                usernameInput.focus();
                return;
            }

            if (!pendingFile && !existingProfile) {
                setStatus('Please choose an image.', 'error');
                return;
            }

            setBusy(true);
            setStatus('Saving…');

            const previousImage = existingProfile ? existingProfile.imagename : null;
            let uploadedPath = null;

            try {
                let imagename = previousImage;

                if (pendingFile) {
                    uploadedPath = currentUser.id + '/' + Date.now() + '.' + extensionFor(pendingFile);
                    const { error: uploadError } = await db
                        .storage
                        .from(BUCKET)
                        .upload(uploadedPath, pendingFile, { contentType: pendingFile.type });

                    if (uploadError) throw uploadError;
                    imagename = uploadedPath;
                }

                // uuid is left out on purpose: the column defaults to auth.uid().
                const row = {
                    email: currentUser.email,
                    username: username,
                    imagename: imagename
                };

                const query = existingProfile
                    ? db.from(TABLE).update(row).eq('uuid', currentUser.id)
                    : db.from(TABLE).insert(row);

                const { data: saved, error: saveError } = await query.select();

                if (saveError) throw saveError;
                if (!saved || saved.length === 0) {
                    throw new Error('Nothing was saved — your session may have expired. Sign in again.');
                }

                // The row now points at the new file, so the old one can go.
                if (previousImage && previousImage !== saved[0].imagename) {
                    await db.storage.from(BUCKET).remove([previousImage]);
                }

                existingProfile = saved[0];
                pendingFile = null;
                imageInput.value = '';
                showStoredPreview(existingProfile.imagename, 'Saved image.');
                setBusy(false);
                setStatus('Profile saved.', 'success');
            } catch (error) {
                // Don't leave the bucket holding a file no row points at.
                if (uploadedPath) {
                    await db.storage.from(BUCKET).remove([uploadedPath]);
                }
                setBusy(false);
                setStatus(friendly(error), 'error');
            }
        }

        imageInput.addEventListener('change', handleFileChoice);
        form.addEventListener('submit', saveProfile);

        loadProfile();
    </script>

</body>

</html>
